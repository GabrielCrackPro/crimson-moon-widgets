name: Release pack

# Publishes the built pack when a v* tag is pushed, or on demand.
# No secrets are needed: the archives are generated from the sources and signed
# by nothing but their own SHA-256.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # A manual dispatch must build the tag it publishes, not the branch.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The tag is the version. A tag that disagrees with package.json would
      # publish archives named one thing and described as another.
      - name: Verify the tag matches package.json
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "::error::Tag '$tag' must start with v"; exit 1 ;;
          esac
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$tag" || {
            echo "::error::package.json says $version, the tag says $tag"
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing $tag"

      - name: Install dependencies
        run: npm ci

      - name: Generate presets and wallpapers
        run: npm run build

      - name: Verify generated pack
        run: npm run check

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Assemble the pack app
        run: |
          set -euo pipefail
          code=$(node -e "const [a,b,c]=process.argv[1].split('.');console.log(a*10000+b*100+Number(c||0))" "$VERSION")
          gradle -p android assembleDebug --no-daemon --stacktrace \
            -PappVersionName="$VERSION" -PappVersionCode="$code"

      - name: Verify the APK is the pack app
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::$APK was not produced"; exit 1; }
          unzip -l "$APK" | grep -q "assets/catalog.json"
          test "$(unzip -l "$APK" | grep -c 'assets/widgets/.*\.kwgt')" -ge 10
          test "$(unzip -l "$APK" | grep -c 'assets/wallpapers/.*\.png')" -ge 6
          AAPT2="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/aapt2"
          "$AAPT2" dump badging "$APK" > /tmp/badging.txt
          grep -q "package: name='com.crimsonmoon.widgets'" /tmp/badging.txt
          grep -q "versionName='$VERSION'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.crimsonmoon.widgets.MainActivity'" /tmp/badging.txt
          unzip -p "$APK" assets/catalog.json > "$RUNNER_TEMP/catalog.json"
          node -e '
            const {readFileSync}=require("fs");
            const m=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/catalog.json","utf8"));
            if (m.package !== "com.crimsonmoon.widgets") { console.error("catalog package is "+m.package); process.exit(1); }
            if (m.version !== process.env.VERSION) { console.error("catalog version is "+m.version+", expected "+process.env.VERSION); process.exit(1); }
            if (m.widgets.length !== 10) { console.error("catalog has "+m.widgets.length+" widgets, expected 10"); process.exit(1); }
            for (const w of m.widgets) {
              if (!w.file || !w.file.endsWith(".kwgt")) {
                console.error("catalog widget has no usable file:", JSON.stringify(w));
                process.exit(1);
              }
            }
            // KWGT resolves a kfile host as the provider authority verbatim
            // (its KFile class never appends a suffix), so the authority the
            // tap uses is exactly the one the manifest declares.
            console.log("catalog ok: " + m.widgets.length + " boards, package " + m.package + ", kfile authority " + m.package + ".kustom.provider");
          '
          rm -f "$RUNNER_TEMP/catalog.json"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q "org.kustom.provider.WIDGETS" /tmp/manifest.txt
          grep -q "org.kustom.api.Provider" /tmp/manifest.txt

      - name: Bundle release archives
        run: npm run release

      - name: Add the APK to the assets
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk "crimson-moon-widgets-$VERSION.apk"
          sha256sum "crimson-moon-widgets-$VERSION.apk" > "crimson-moon-widgets-$VERSION.apk.sha256"
          mkdir -p release
          mv "crimson-moon-widgets-$VERSION.apk" "crimson-moon-widgets-$VERSION.apk.sha256" release/
          ls -lh release/

      - uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          {
            echo "Ten KWGT presets and six matching wallpapers, drawn from the same crimson palette."
            echo
            echo "**Presets** — \`crimson-moon-widgets-$version.zip\`: the ten \`.kwgt\` files plus the manifest that lists their grid, module count and checksum."
            echo
            echo "**Wallpapers** — \`crimson-moon-wallpapers-$version.zip\`: six designs at 1080×2400 and 1440×3200, the SVG originals, plus a manifest."
            echo
            echo "**App** — \`crimson-moon-widgets-$version.apk\`: browse the presets with previews, hand one to KWGT in a tap, and apply the backdrops. The presets also register as an installed Kustom pack through the app's \`org.kustom.api.Provider\`, so they show up in KWGT's installed-packs tab — with their names, descriptions and preview images — not just when you tap them here. Debug-signed, so sideload it rather than expecting an update channel."
            echo
            echo "Each file ships a \`.sha256\` beside it; check it with \`sha256sum -c\`."
            echo
            echo "**Install**"
            echo "1. Install the APK once — the pack registers through the app, so the app has to be installed on the phone for KWGT to see these presets as an installed pack."
            echo "2. Extract the presets archive and copy every \`.kwgt\` into \`Kustom/widgets/\` on the phone. Do not unzip the presets themselves."
            echo "3. Add a KWGT widget, open the preset picker, choose the installed Crimson Moon pack, and pick the preset. Alternatively, tap the preset in this app — it opens the same picker at that preset."
            echo "4. Set a wallpaper from the other archive at its native size."

            echo "Do not use Import on a preset that already sits in \`Kustom/widgets/\`: Kustom copies the file onto itself and leaves zero bytes."
            echo
            echo "If tapping a preset opens KWGT and then shows \`Error preset file not found\`:"
            echo "  - The tap hands KWGT \`kfile://com.crimsonmoon.widgets.kustom.provider/widgets/<file>.kwgt\`. KWGT uses the host of that URI as the provider authority verbatim, so it must be the authority the app declares (\`<applicationId>.kustom.provider\`), not the bare package name older docs still show."
            echo "  - KWGT reads the presets out of the installed app through that authority, so the app has to be installed — and the installed build has to be this one, or KWGT is reading the old files."
            echo
            echo "The presets are verified structurally and by render, not by importing them into KWGT; the wallpapers have not been tried against a launcher's parallax."
          } > notes.md
          cat notes.md
          assets=(release/*.zip release/*.apk release/*.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "Crimson Moon Widgets $version" --notes-file notes.md
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Crimson Moon Widgets $version" \
              --notes-file notes.md \
              --verify-tag
          fi
