name: Build pack and app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate presets and wallpapers
        run: npm run build

      - name: Verify generated pack
        run: npm run check

      # The presets and the check are the product; this step guards the shape of
      # the tree a phone or a release would consume, not the sources behind it.
      - name: Sanity-check generated tree
        run: |
          set -euo pipefail
          presets=$(ls dist/*.kwgt | wc -l)
          wallpapers=$(ls dist/wallpapers/*.png | wc -l)
          test "$presets" -ge 10
          test "$wallpapers" -ge 12
          test -f dist/manifest.json
          test -f dist/wallpapers/manifest.json
          test -f preview/index.html
          # Every preset has to be a readable zip with preset.json at its root.
          for f in dist/*.kwgt; do unzip -l "$f" | grep -q preset.json; done
          echo "$presets presets, $wallpapers wallpapers, $(du -sh dist | cut -f1) in dist"

      # Both passes are claimed to be reproducible. That claim is what lets the
      # manifests carry checksums, so it is verified rather than asserted.
      - name: Rebuild and compare
        run: |
          set -euo pipefail
          find dist -type f | sort | xargs sha256sum > "$RUNNER_TEMP/build-a.txt"
          npm run build > /dev/null
          find dist -type f | sort | xargs sha256sum > "$RUNNER_TEMP/build-b.txt"
          if ! diff "$RUNNER_TEMP/build-a.txt" "$RUNNER_TEMP/build-b.txt"; then
            echo "::error::a rebuild of unchanged sources produced different bytes"
            exit 1
          fi
          echo "$(wc -l < "$RUNNER_TEMP/build-a.txt") files rebuild identically"

      - uses: actions/upload-artifact@v7
        with:
          name: crimson-moon-pack
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Assemble the pack app
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          code=$(node -e "const [a,b,c]=process.argv[1].split('.');console.log(a*10000+b*100+Number(c||0))" "$version")
          gradle -p android assembleDebug --no-daemon --stacktrace \
            -PappVersionName="$version" -PappVersionCode="$code"

      # The APK is the deliverable, so the assertions run against it rather than
      # against the project that produced it.
      - name: Verify the APK is the pack app
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::$APK was not produced"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "assets/catalog.json"
          presets=$(unzip -l "$APK" | grep -c "assets/widgets/.*\.kwgt")
          wallpapers=$(unzip -l "$APK" | grep -c "assets/wallpapers/.*\.png")
          test "$presets" -ge 10
          test "$wallpapers" -ge 6
          AAPT2="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt | head -2
          grep -q "package: name='com.crimsonmoon.widgets'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.crimsonmoon.widgets.MainActivity'" /tmp/badging.txt
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | tee /tmp/manifest.txt | grep -q "kustom.provider"
          grep -q "org.kustom.provider.WIDGETS" /tmp/manifest.txt
          grep -q "org.kustom.api.Provider" /tmp/manifest.txt
          echo "$presets presets and $wallpapers wallpapers inside the APK"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk crimson-moon-widgets-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: crimson-moon-widgets-apk
          path: crimson-moon-widgets-debug.apk
          if-no-files-found: error
          retention-days: 30
