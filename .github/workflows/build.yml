name: Build pack and app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate presets and wallpapers
        run: npm run build

      - name: Verify generated pack
        run: npm run check

      # The tap authority is assembled in three places (the app, this workflow,
      # the release notes); this guard fails if they ever drift apart again.
      - name: Verify the kfile authority stays consistent
        run: node tools/verify-contraction.mjs

      # The presets and the check are the product; this step guards the shape of
      # the tree a phone or a release would consume, not the sources behind it.
      - name: Sanity-check generated tree
        run: |
          set -euo pipefail
          presets=$(ls dist/*.kwgt | wc -l)
          wallpapers=$(ls dist/wallpapers/*.png | wc -l)
          test "$presets" -ge 10
          test "$wallpapers" -ge 12
          test -f dist/manifest.json
          test -f dist/wallpapers/manifest.json
          test -f preview/index.html
          # Every preset has to be a readable zip with preset.json at its root
          # and the preview thumb entries KWGT's picker loads.
          for f in dist/*.kwgt; do
            unzip -l "$f" | grep -q preset.json
            unzip -l "$f" | grep -q preset_thumb_portrait.jpg
            unzip -l "$f" | grep -q preset_thumb_landscape.jpg
          done
          echo "$presets presets, $wallpapers wallpapers, $(du -sh dist | cut -f1) in dist"
          # KWGT loads presets through the pack provider when they live in the
          # app's assets, so the same build tree must be the one the app ships.
          # The Android step builds the app in the same job; it does not rebuild
          # the pack, intentionally, so the APK's assets are the bytes that were
          # verified above — not whatever a second run happens to produce.

      # Both passes are claimed to be reproducible. That claim is what lets the
      # manifests carry checksums, so it is verified rather than asserted.
      - name: Rebuild and compare
        run: |
          set -euo pipefail
          find dist -type f | sort | xargs sha256sum > "$RUNNER_TEMP/build-a.txt"
          npm run build > /dev/null
          find dist -type f | sort | xargs sha256sum > "$RUNNER_TEMP/build-b.txt"
          if ! diff "$RUNNER_TEMP/build-a.txt" "$RUNNER_TEMP/build-b.txt"; then
            echo "::error::a rebuild of unchanged sources produced different bytes"
            exit 1
          fi
          echo "$(wc -l < "$RUNNER_TEMP/build-a.txt") files rebuild identically"

      - uses: actions/upload-artifact@v7
        with:
          name: crimson-moon-pack
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Assemble the pack app
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          code=$(node -e "const [a,b,c]=process.argv[1].split('.');console.log(a*10000+b*100+Number(c||0))" "$version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          gradle -p android assembleDebug --no-daemon --stacktrace \
            -PappVersionName="$version" -PappVersionCode="$code"

      # The APK is the deliverable, so the assertions run against it rather than
      # against the project that produced it.
      - name: Verify the APK is the pack app
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::$APK was not produced"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "assets/catalog.json"
          presets=$(unzip -l "$APK" | grep -c "assets/widgets/.*\.kwgt")
          wallpapers=$(unzip -l "$APK" | grep -c "assets/wallpapers/.*\.png")
          test "$presets" -ge 10
          test "$wallpapers" -ge 6
          AAPT2="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt | head -2
          grep -q "package: name='com.crimsonmoon.widgets'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.crimsonmoon.widgets.MainActivity'" /tmp/badging.txt
          unzip -p "$APK" assets/catalog.json > "$RUNNER_TEMP/catalog.json"
          node -e '
            const {readFileSync}=require("fs");
            const m=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/catalog.json","utf8"));
            if (m.package !== "com.crimsonmoon.widgets") { console.error("catalog package is "+m.package); process.exit(1); }
            if (m.version !== process.env.VERSION) { console.error("catalog version is "+m.version+", expected "+process.env.VERSION); process.exit(1); }
            if (m.widgets.length !== 10) { console.error("catalog has "+m.widgets.length+" widgets, expected 10"); process.exit(1); }
            for (const w of m.widgets) {
              if (!w.file || !w.file.endsWith(".kwgt")) {
                console.error("catalog widget has no usable file:", JSON.stringify(w));
                process.exit(1);
              }
            }
            // KWGT resolves a kfile host as the provider authority verbatim
            // (its KFile class never appends a suffix), so the authority the
            // tap uses is exactly the one the manifest declares.
            const kfile = "kfile://" + m.package + ".kustom.provider/widgets/";
            console.log("catalog ok: " + m.widgets.length + " boards, package " + m.package + ", kfile " + kfile + "<file>.kwgt");
          '
          rm -f "$RUNNER_TEMP/catalog.json"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | tee /tmp/manifest.txt | grep -q "kustom.provider"
          grep -q "org.kustom.provider.WIDGETS" /tmp/manifest.txt
          grep -q "org.kustom.api.Provider" /tmp/manifest.txt
          echo "$presets presets and $wallpapers wallpapers inside the APK"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk crimson-moon-widgets-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: crimson-moon-widgets-apk
          path: crimson-moon-widgets-debug.apk
          if-no-files-found: error
          retention-days: 30
